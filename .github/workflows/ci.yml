name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Build the unsigned self-contained macOS arm64 release candidate
        required: false
        default: false
        type: boolean
      real_model:
        description: Run the extended packaged real-model transcription gate
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  checks:
    name: Lint, build, and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Test public release metadata and documentation
        run: npm run smoke:public-release

      - name: Test release changelog and curated notes
        run: npm run smoke:release-notes

      - name: Test published release closure verifier
        run: npm run smoke:published-release

      - name: Test release metadata contract
        run: npm run smoke:release-metadata

      - name: Test bundle-size measurement contract
        run: npm run smoke:bundle-size

      - name: Test canonical release identity
        run: npm run smoke:release-identity

      - name: Test public release workflow structure
        run: npm run smoke:release-workflow

      - name: Test runtime contract
        run: npm run smoke:runtime-contract

      - name: Test pinned runtime artifact metadata
        run: npm run smoke:runtime-artifacts

      - name: Test canonical brand assets
        run: npm run smoke:brand

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install backend smoke dependencies
        run: python -m pip install fastapi pydantic python-multipart requests

      - name: Test deterministic model manager workflow
        run: npm run smoke:model-manager

      - name: Lint frontend
        run: npm run lint

      - name: Test clip draft workflow
        run: npm run test:clip-drafts --prefix frontend

      - name: Test transcript selection workflow
        run: npm run test:transcript-selection --prefix frontend

      - name: Test transcript search workflow
        run: npm run test:transcript-search --prefix frontend

      - name: Test speaker stats workflow
        run: npm run test:speaker-stats --prefix frontend

      - name: Test caption designer workflow
        run: npm run test:caption-designer --prefix frontend

      - name: Test social publishing workflow
        run: npm run test:social-publishing --prefix frontend

      - name: Test hook frame workflow
        run: npm run test:hook-frames --prefix frontend

      - name: Test support report redaction
        run: npm run test:support-report --prefix frontend

      - name: Test playback sync workflow
        run: npm run test:playback-sync --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Test packaged renderer policy
        run: npm run smoke:renderer-policy

      - name: Run backend smoke tests
        run: npm run smoke:backend

      - name: Compile backend
        run: python -m compileall -q backend

  release-candidate:
    name: Build macOS arm64 release candidate
    if: github.event_name == 'workflow_dispatch' && inputs.release_candidate
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install release build prerequisites
        run: brew install ffmpeg librsvg imagemagick

      - name: Verify native runner architecture
        run: |
          echo "uname -m: $(uname -m)"
          echo "node arch: $(node -p process.arch)"
          test "$(uname -m)" = "arm64"
          test "$(node -p process.arch)" = "arm64"

      - name: Build and verify ad-hoc self-contained release candidate
        run: |
          DESIRED_NOFILE=65536
          HARD_NOFILE="$(ulimit -Hn)"
          SOFT_BEFORE="$(ulimit -Sn)"
          KERNEL_MAX="$(sysctl -n kern.maxfilesperproc 2>/dev/null || true)"
          echo "open-file soft limit before: $SOFT_BEFORE"
          echo "open-file hard limit: $HARD_NOFILE"
          echo "kern.maxfilesperproc: $KERNEL_MAX"
          echo "open-file desired target: $DESIRED_NOFILE"
          TARGET_NOFILE="$DESIRED_NOFILE"
          if [[ "$HARD_NOFILE" =~ ^[0-9]+$ ]] && [ "$HARD_NOFILE" -lt "$TARGET_NOFILE" ]; then
            TARGET_NOFILE="$HARD_NOFILE"
          fi
          if [[ "$KERNEL_MAX" =~ ^[0-9]+$ ]] && [ "$KERNEL_MAX" -gt 0 ] && [ "$KERNEL_MAX" -lt "$TARGET_NOFILE" ]; then
            TARGET_NOFILE="$KERNEL_MAX"
          fi
          echo "open-file capped target: $TARGET_NOFILE"
          if [ "$SOFT_BEFORE" != "unlimited" ] && [[ "$SOFT_BEFORE" =~ ^[0-9]+$ ]] && [ "$SOFT_BEFORE" -lt "$TARGET_NOFILE" ]; then
            ulimit -Sn "$TARGET_NOFILE"
          fi
          SOFT_AFTER="$(ulimit -Sn)"
          echo "open-file soft limit after: $SOFT_AFTER"
          if [[ "$SOFT_BEFORE" =~ ^[0-9]+$ && "$SOFT_AFTER" =~ ^[0-9]+$ ]] && [ "$SOFT_AFTER" -lt "$SOFT_BEFORE" ]; then
            echo "macOS signing open-file guard would lower the existing soft limit"
            exit 1
          fi
          if [ "${{ inputs.real_model }}" = "true" ]; then
            npm run release:rc:arm64 -- --real-model
          else
            npm run release:rc:arm64
          fi

      - name: Upload intended candidate outputs
        uses: actions/upload-artifact@v4
        with:
          name: scriptcut-release-candidate-arm64
          if-no-files-found: error
          path: |
            dist/release-candidate/*.dmg
            dist/release-candidate/SHA256SUMS.txt
            dist/release-candidate/release-manifest.json
            dist/release-candidate/RELEASE_NOTES.md
            dist/release-candidate/bundle-size-report.json
